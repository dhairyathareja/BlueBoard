name: Backend Deployment

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "deployment/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Backend
        run: |
          rsync -av --delete --exclude='.env.production' backend/ /opt/blueboard/backend/
          rsync -av --delete deployment/ /opt/blueboard/deployment/

      - name: Deploy Container
        run: |
          cd /opt/blueboard/deployment
          docker compose down || true
          docker compose up -d --build